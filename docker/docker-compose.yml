version: "3.9"

services:
  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: enterprise_ai_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-enterprise_ai}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/app/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../backend/app/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: enterprise_ai_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-enterprise_ai}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-apppassword}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      MLFLOW_TRACKING_URI: http://mlflow:5001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "5000:5000"
    volumes:
      - ../ml/models:/app/ml/models
      - ../ml/data:/app/ml/data
      - ../documents:/app/documents
      - backend_logs:/app/backend/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── MLflow Tracking Server ─────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: enterprise_ai_mlflow
    restart: unless-stopped
    command: >
      bash -c "pip install mlflow mysqlclient --quiet &&
               mlflow server
               --host 0.0.0.0
               --port 5001
               --backend-store-uri mysql+mysqldb://${DB_USER:-app_user}:${DB_PASSWORD:-apppassword}@mysql:3306/${DB_NAME:-enterprise_ai}
               --default-artifact-root /mlflow/artifacts"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5001:5001"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  # ── Frontend (React) ───────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: enterprise_ai_frontend
    working_dir: /app
    command: sh -c "npm install && npm start"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app

volumes:
  mysql_data:
  backend_logs:
  mlflow_artifacts:
